name: Offline checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.11.27
      - run: uv sync --frozen --python '${{ matrix.python }}'
      - run: uv run --frozen python -m unittest discover -s tests_broll
      - run: uv run --frozen broll-video --help
      - run: uv run --frozen broll-autodl --help
      - run: uv run --frozen python scripts/check_release.py
      - run: bash -n deploy/install-stack.sh deploy/launch-comfy.sh
