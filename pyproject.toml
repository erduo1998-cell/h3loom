[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "h3loom"
version = "0.2.0rc1"
description = "H3Loom: SRT to storyboard to MiniMax H3 cloud B-roll"
readme = "README.en.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "erduo1998-cell"}]
dependencies = [
  "jsonschema>=4.20",
  "Pillow>=10.0",
]

[project.urls]
Repository = "https://github.com/erduo1998-cell/h3loom"
Issues = "https://github.com/erduo1998-cell/h3loom/issues"

[project.scripts]
broll-video = "broll_video.cli:main"
broll-autodl = "broll_video.autodl.cli:main"

[tool.setuptools.packages.find]
include = ["broll_video*"]

[tool.setuptools.package-data]
"broll_video.autodl" = ["workflows/*.json"]
