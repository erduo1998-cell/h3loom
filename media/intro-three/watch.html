<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>H3Loom — 金属材质修订</title><style>*{box-sizing:border-box}body{margin:0;background:#0c0c0e;color:#eee;font:14px system-ui}main{max-width:1120px;margin:24px auto;padding:0 24px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}h1{font-size:17px;font-weight:550}a{color:#9999aa;text-decoration:none;font-size:12px}video{width:100%;display:block;background:#000;max-height:calc(100vh - 160px)}p{font-size:12px;line-height:1.8;color:#89898f}.marks{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}select,button{border:1px solid #333;border-radius:6px;background:#19191b;color:#bbb;padding:8px 12px;cursor:pointer}</style></head><body><main><header><h1>H3Loom / 金属材质修订</h1><a href="/">逐帧审片与运动曲线 →</a></header><video id="film" controls playsinline preload="metadata" poster="/outputs/intro-three/poster.png"><source src="/outputs/intro-three/h3loom-type-metal.mp4" type="video/mp4"></video><div class="marks"><select id="version" aria-label="对比版本"><option value="metal">金属材质修订版</option><option value="connected">已认可的衔接版</option><option value="study">上一版</option></select><button data-time="0">从头播放</button><button data-time="5.92">型号归入芯片</button><button data-time="7.7">芯片接文字</button><button data-time="10.2">文字接 4K</button><button data-time="13.2">拼版重排</button><button id="slow">0.25× 慢放</button></div><p>24 秒 · 1920 × 1080 · 60 fps · 原创代码合成配乐<br>对照重点：保留文字再重排、匹配硬切构图、让前镜对象进入后镜。新增连接为 H3Loom 适配。</p></main><script>const v=document.getElementById('film');const requested=new URLSearchParams(location.search).get('version');if(['metal','connected','study'].includes(requested)){document.getElementById('version').value=requested;v.src='/outputs/intro-three/h3loom-type-'+requested+'.mp4';}document.getElementById('version').onchange=e=>{const t=v.currentTime,r=v.playbackRate,playing=!v.paused;v.src='/outputs/intro-three/h3loom-type-'+e.target.value+'.mp4';v.addEventListener('loadedmetadata',()=>{v.currentTime=t;v.playbackRate=r;if(playing)v.play()},{once:true});v.load()};document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{v.currentTime=Number(b.dataset.time);v.play()});document.getElementById('slow').onclick=e=>{v.playbackRate=v.playbackRate===1?.25:1;e.target.textContent=v.playbackRate===1?'0.25× 慢放':'恢复 1×';v.play()};</script></body></html>
