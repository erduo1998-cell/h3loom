<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>H3Loom · 动画审片</title>
<style>html{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#050505;color:#eee;font:15px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:1400px;margin:auto;padding:32px 24px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}h1{font-size:22px;margin:0;letter-spacing:-.5px}a{color:#bbb}video{width:100%;max-height:72vh;background:#000;display:block}nav{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}button,select{font:inherit;background:#171719;border:1px solid #333;border-radius:7px;color:#ddd;padding:10px 14px;cursor:pointer}button:hover{background:#29292d}p{color:#96969e;line-height:1.7}output{font-variant-numeric:tabular-nums;margin:0 10px}small{color:#888}</style>
<main><header><h1>H3Loom <small> / 本地代码动画</small></h1><a href="https://www.youtube.com/watch?v=3uAIqqg8ZHo" target="_blank" rel="noreferrer">原片参考 ↗</a></header>
<video id="film" preload="metadata" src="../../outputs/promo-v2-final/h3loom-intro-v2.mp4"></video>
<nav><button id="play">播放 / 暂停</button><button id="back">后退 8 帧</button><button id="next">前进 8 帧</button><output id="time">0.00 s</output><select id="rate" aria-label="播放速度"><option value="1">正常速度</option><option value="0.5">半速</option><option value="0.25">四分之一速度</option></select></nav>
<nav id="chapters"></nav><p>检查连续动作：靠近与旋转的速度变化、字面反射、四格展开与镜头推进、切点音效，以及结尾文字的停留。概念模块与分镜均由本地代码渲染，不是实体硬件或 H3 生成样例。</p></main>
<script>const film=document.querySelector('#film');if(location.search.includes('preview'))film.src='../../outputs/promo-v2-final/motion-preview.mp4';document.querySelector('#play').onclick=()=>film.paused?film.play():film.pause();function step(d){film.pause();film.currentTime=Math.max(0,Math.min(film.duration||0,film.currentTime+d/30))}document.querySelector('#back').onclick=()=>step(-8);document.querySelector('#next').onclick=()=>step(8);document.querySelector('#rate').onchange=e=>film.playbackRate=Number(e.target.value);film.ontimeupdate=()=>document.querySelector('#time').value=film.currentTime.toFixed(2)+' s';for(const [label,t]of [['片头',0],['巨字',2.6],['四格',4.6],['流动反射',7.4],['云端',8.45],['4K',12.4],['组合排版',14.2],['回到产品',17],['片尾',20.1]]){let b=document.createElement('button');b.textContent=label;b.onclick=()=>{film.pause();film.currentTime=t};document.querySelector('#chapters').append(b)}</script></html>
